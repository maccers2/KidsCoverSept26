name: Update Jamie Monday Tuesday
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<li><input type="checkbox" id="c14"><label for="c14">Jamie — check if French Horn needed for House Orchestra <span class="flag">TBC</span></label></li>','<li><input type="checkbox" id="c14"><label for="c14">Jamie — take French Horn for House Music after school, finishes 5pm. He will need to leave the French Horn at school because Dad cannot collect him.</label></li>')
          s=s.replace('<tr><td>Izzy &amp; Jamie</td><td>—</td><td>—</td><td>Walk home from school</td><td class="who-david">Drop off, then singing this evening — back late</td><td class="who-natalia">At home. Let dogs out periodically.</td></tr>','<tr><td>Izzy</td><td>—</td><td>—</td><td>Walks home from school</td><td class="who-david">Drop off, then singing this evening — back late</td><td class="who-natalia">At home. Let dogs out periodically.</td></tr>\n        <tr><td>Jamie</td><td>House Music</td><td>After school–5pm</td><td>Leaves French Horn at school because Dad cannot collect him</td><td class="who-david">Arrange to collect Jamie on Tuesday so he can bring the French Horn home</td><td class="who-natalia">—</td></tr>')
          s=s.replace('<li><input type="checkbox" id="c15b"><label for="c15b">Remind Izzy and Jamie about how they are expected to get home</label></li>','<li><input type="checkbox" id="c15b"><label for="c15b">Remind Izzy and Jamie about how they are expected to get home</label></li>\n        <li><input type="checkbox" id="c15c"><label for="c15c">David — collect Jamie today so he can bring his French Horn home from school</label></li>')
          s=s.replace('<tr><td>Jamie</td><td>—</td><td>—</td><td>Walks home from school</td><td class="who-david">—</td><td class="who-natalia">—</td></tr>','<tr><td>Jamie</td><td>—</td><td>—</td><td>Collected by David so he can bring his French Horn home</td><td class="who-david">Collect Jamie from school and bring French Horn home</td><td class="who-natalia">—</td></tr>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name updater
          git config user.email updater@example.com
          git add index.html
          git commit -m "Update Jamie Monday and Tuesday"
          git push
