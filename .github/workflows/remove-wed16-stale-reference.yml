name: Remove stale Wednesday reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Wed 16
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<tr><td>Izzy</td><td>Lacrosse</td><td>After school–5pm</td><td>Walks home after lacrosse unless House Orchestra is on (Dad will collect if so)</td><td class="who-david">Home for 5pm to collect from lacrosse and House Orchestra</td><td class="who-natalia">At home — let dogs out periodically</td></tr>'
          new = '<tr><td>Izzy</td><td>Lacrosse</td><td>After school–5pm</td><td>Walks home after lacrosse</td><td class="who-david">No House Orchestra collection needed today</td><td class="who-natalia">At home — let dogs out periodically</td></tr>'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove stale Wednesday House Orchestra reference"
          git push
