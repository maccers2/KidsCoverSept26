name: Update Thursday Jajja cover

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-thursday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Thursday cover details
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<span class="day-name">Thu 17 Sept</span>')
          end = s.index('<span class="day-name">Fri 18 Sept</span>')
          before, thu, after = s[:start], s[start:end], s[end:]

          thu = thu.replace(
              '<div class="day-risk">No dog cover today — whoever gets home first lets them out immediately and checks for accidents. Also a tight three-way pickup: Sam, Jamie and Izzy all land within 30 minutes.</div>',
              '<div class="cover-note"><strong>Jajja confirmed:</strong> handling all pick-ups and all club drop-offs for the kids today.</div>\n    <div class="day-risk">No dog cover today — whoever gets home first lets them out immediately and checks for accidents.</div>'
          )
          thu = thu.replace(
              'Remind Izzy and Jamie about how they are expected to get home',
              'Remind the kids that Jajja is handling today’s pick-ups and club drop-offs'
          )
          thu = thu.replace(
              '<thead><tr><th>Child</th><th>Activity</th><th>Time</th><th>Getting home</th><th>David</th><th>Natalia</th></tr></thead>',
              '<thead><tr><th>Child</th><th>Activity</th><th>Time</th><th>Getting home</th><th>Cover</th><th>Natalia</th></tr></thead>'
          )
          thu = thu.replace(
              '<tr><td>Sam</td><td>Piano</td><td>5.10–5.40pm</td><td>Collected by David, 4.55pm</td><td class="who-david">Collect Sam by 4.55pm, drop at piano for 5.10pm</td><td class="who-natalia">In London today</td></tr>',
              '<tr><td>Sam</td><td>Piano</td><td>5.10–5.40pm</td><td>Collected by Jajja, 4.55pm</td><td class="who-david">Jajja handling pick-up and piano drop-off</td><td class="who-natalia">In London today</td></tr>'
          )
          thu = thu.replace(
              '<tr><td>Jamie</td><td>Rugby</td><td>After school–5pm</td><td>Collected by David, 5pm</td><td class="who-david">Pick up 5pm</td><td class="who-natalia">—</td></tr>',
              '<tr><td>Jamie</td><td>Rugby</td><td>After school–5pm</td><td>Collected by Jajja, 5pm</td><td class="who-david">Jajja handling rugby pick-up</td><td class="who-natalia">—</td></tr>'
          )
          thu = thu.replace(
              '<tr><td>Izzy</td><td>Choir</td><td>5.15–6.15pm</td><td>Walks home after school</td><td class="who-david">Collect Izzy at 4.45pm sharp, collect Sam by 4.55pm, drop Sam at piano for 5.10pm, then drop Izzy at choir 5.15pm, collect at 6.15pm</td><td class="who-natalia">—</td></tr>',
              '<tr><td>Izzy</td><td>Choir</td><td>5.15–6.15pm</td><td>Collected by Jajja</td><td class="who-david">Jajja handling pick-up, choir drop-off and collection</td><td class="who-natalia">—</td></tr>'
          )

          s = before + thu + after
          p.write_text(s, encoding='utf-8')
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Thursday cover for Jajja"
          git push