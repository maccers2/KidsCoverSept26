name: Update Jamie schedule

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jamie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Jamie schedule details
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Wed 16: Model UN to 5pm; no French horn / House Orchestra.
          s = s.replace(
              '<li><input type="checkbox" id="c2"><label for="c2">Jamie — check if French Horn needed for House Orchestra <span class="flag">TBC</span></label></li>',
              '<li><input type="checkbox" id="c2"><label for="c2">Jamie — Model UN after school, finishes 5pm. No French Horn needed today.</label></li>'
          )
          s = s.replace(
              '<tr><td>Jamie</td><td>House Orchestra <span class="flag">TBC</span></td><td>—</td><td>Walks home unless orchestra is on</td><td class="who-david">—</td><td class="who-natalia">—</td></tr>',
              '<tr><td>Jamie</td><td>Model UN</td><td>After school–5pm</td><td>Walks home after Model UN</td><td class="who-david">No French Horn / House Orchestra today</td><td class="who-natalia">—</td></tr>',
              1
          )

          # Thu 17: House Music at lunchtime; French horn required.
          s = s.replace(
              '<li><input type="checkbox" id="c6"><label for="c6">Jamie — pack French Horn (lesson today)</label></li>',
              '<li><input type="checkbox" id="c6"><label for="c6">Jamie — take French Horn for House Music at lunchtime</label></li>'
          )

          # Wed 23 (user referred to Wednesday 25th): House Orchestra + Model UN; collect at 5pm due to horn.
          s = s.replace(
              '<li><input type="checkbox" id="c17"><label for="c17">Jamie — check if French Horn needed for House Orchestra <span class="flag">TBC</span></label></li>',
              '<li><input type="checkbox" id="c17"><label for="c17">Jamie — take French Horn for House Orchestra. Model UN after school finishes at 5pm.</label></li>'
          )
          s = s.replace(
              '<tr><td>Jamie</td><td>House Orchestra <span class="flag">TBC</span></td><td>—</td><td>Walks home unless orchestra is on</td><td class="who-david">—</td><td class="who-natalia">—</td></tr>',
              '<tr><td>Jamie</td><td>House Orchestra + Model UN</td><td>Model UN finishes 5pm</td><td>Needs collecting at 5pm because he has his French Horn</td><td class="who-david">Collect Jamie at 5pm or arrange cover</td><td class="who-natalia">—</td></tr>',
              1
          )

          p.write_text(s, encoding='utf-8')
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Jamie school activities"
          git push
